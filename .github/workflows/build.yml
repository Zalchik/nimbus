# Tests and builds Nimbus for Windows and Linux. Builds are kept as workflow artifacts only:
# nothing is published to Releases from here.
name: build

on:
  push:
    tags: ["v*"]
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries Qt needs, a virtual display, dconf for the proxy test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 xvfb xauth file \
            dbus-x11 dconf-service dconf-cli gsettings-desktop-schemas libglib2.0-bin rpm
      - run: pip install PySide6 httpx pyinstaller Pillow
      - run: python tools/fetch_cores.py linux
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          NIMBUS_TEST_GSETTINGS: "1"   # a throwaway D-Bus session: the GNOME proxy test may write
        run: dbus-run-session -- python tests/test_core_logic.py
      - name: AppImage
        run: python build_linux.py
      - name: Smoke test (the AppImage starts and shows its window)
        run: |
          export NIMBUS_DATA_DIR="$RUNNER_TEMP/nimbus-data" APPIMAGE_EXTRACT_AND_RUN=1
          app=$(ls dist/*/Nimbus-*-x86_64.AppImage)
          set +e
          xvfb-run -a timeout 30 "$app" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          cat "$NIMBUS_DATA_DIR/logs/startup.log"
          test "$code" -eq 124   # still running when timeout stopped it
          grep -q "window shown" "$NIMBUS_DATA_DIR/logs/startup.log"
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-linux
          path: dist/*/*

  # The .deb and .rpm the linux job built: install, start, upgrade and remove while running.
  deb:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nimbus-linux
          path: parts
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils
          sudo sh tools/ci_package_check.sh deb "$(ls parts/*/Nimbus-*-amd64.deb)" "$USER"

  rpm:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: |
          dnf install -y xorg-x11-server-Xvfb xauth desktop-file-utils findutils util-linux \
            mesa-libEGL mesa-libGL libxkbcommon-x11 fontconfig dbus-libs
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nimbus-linux
          path: parts
      - run: |
          useradd -m tester
          sh tools/ci_package_check.sh rpm "$(ls parts/*/Nimbus-*-x86_64.rpm)" tester

  # make install from the source code with the system's own Python, as users do: an older
  # Ubuntu (Python 3.10), a current one, and Fedora.
  make-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv make xvfb xauth \
            desktop-file-utils xdg-utils libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - run: sh tools/ci_make_check.sh

  make-fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: |
          dnf install -y python3 make git xorg-x11-server-Xvfb xauth desktop-file-utils xdg-utils \
            mesa-libEGL mesa-libGL libxkbcommon libxkbcommon-x11 xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil fontconfig dbus-libs which findutils
      - uses: actions/checkout@v4
      - name: As a normal user (TUN rights, menu entries and links are per user)
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && sh tools/ci_make_check.sh"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install PySide6 httpx pyinstaller Pillow
      - run: python tools/fetch_cores.py windows
      - name: Tests
        run: python tests/test_core_logic.py
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-windows
          path: |
            dist/*/Nimbus-*-setup.exe
            dist/*/Nimbus-*-portable.zip
            dist/*/SHA256SUMS.txt

  # On a tag: every file of the release in one artifact with one SHA256SUMS.txt, ready to upload
  # to a GitHub release by hand.
  release-files:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: |
          mkdir release
          find parts -type f ! -name SHA256SUMS.txt -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-release
          path: release/*
